# ========== 窗口和面板管理 ==========
bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"

# ========== 鼠标支持 ==========
set -g mouse on

# ========== 复制模式设置 ==========
set -g mode-keys vi

# 取消默认的 Ctrl+空格 绑定
unbind-key -T copy-mode-vi C-Space

# 将 Ctrl+q 绑定为开始选择
bind-key -T copy-mode-vi C-q send-keys -X begin-selection

# ========== 复制到系统剪贴板 ==========
# 方法1：使用 xclip（推荐，需要安装 xclip）
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# 方法2：如果方法1不行，试试这个（写入主要选择区）
# bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection primary -i"
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection primary -i"

# 方法3：如果 xclip 一直卡住，加上超时
# bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "timeout 1 xclip -selection clipboard -i"
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "timeout 1 xclip -selection clipboard -i"
